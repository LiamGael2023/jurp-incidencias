# GeoServer detrás de nginx.
#
# ══════════════════════════════════════════════════════════════════════
# ESTO NO ES UN server{} APARTE: SON DOS location{} QUE VAN DENTRO DEL
# BLOQUE QUE YA SIRVE EL FRONT
# ══════════════════════════════════════════════════════════════════════
#
# Se pegan en /etc/nginx/sites-available/jurp-front, dentro del mismo
# `server { ... }` que tiene `root /var/www/envs/front/current;`, al lado
# de los `location /vigapi/` que ya están.
#
# POR QUÉ EN EL MISMO HOST Y NO EN geoserver.jriegopresurizado.org.pe:
#
#   La web pide las teselas desde el navegador. Si GeoServer vive en otro
#   dominio, cada petición es cruzada y hace falta CORS: cabeceras en el
#   servidor, preflights, y el día que falte una el mapa sale en blanco
#   sin un solo error visible salvo en la consola. En el mismo host no hay
#   nada de eso — el navegador ni se lo plantea.
#
#   Para WMS desde QGIS da igual: QGIS no aplica CORS. Así que el mismo
#   host es gratis para unos y mejor para otros.
#
# El orden importa: `/geoserver/web/` va ANTES que `/geoserver/`, porque
# nginx elige el prefijo más largo y queremos que el panel caiga en la
# regla restringida.

# ── 1. El panel de administración, cerrado ────────────────────────────
#
# Aquí se crean usuarios, se cambian claves y se leen archivos del disco
# con el "Store" apropiado. Abierto a internet es una puerta al servidor,
# no una página de configuración. Y GeoServer nace con admin/geoserver,
# que es lo primero que prueban los bots.
#
# Elige UNA de las dos formas:
#
#   (a) Por IP — si trabajas desde una fija. Descomenta y pon la tuya.
#   (b) Cerrado del todo, y se entra por túnel SSH cuando haga falta:
#
#         ssh -L 8085:127.0.0.1:8085 webadmin@192.81.132.87
#         # y en tu navegador: http://localhost:8085/geoserver/web/
#
#       Esta es la buena. No hay nada que recordar cerrar después.
#
location /geoserver/web/ {
    # (a) Por IP:
    # allow 200.48.0.0/16;     # <- tu IP o rango
    # allow 127.0.0.1;
    # deny all;

    # (b) Cerrado del todo (por defecto):
    return 404;

    # Si eliges (a), comenta el `return 404;` de arriba y descomenta esto:
    # proxy_pass http://127.0.0.1:8085;
    # include /etc/nginx/proxy_params;
    # proxy_set_header X-Forwarded-Proto $scheme;
}

# Lo mismo para el REST de configuración: por ahí se puede hacer todo lo
# que hace el panel, sin pasar por él. Cerrarlo a medias no cierra nada.
location /geoserver/rest/ {
    return 404;
}

# ── 2. Los servicios, abiertos ────────────────────────────────────────
#
# WMS, WFS, WMTS y las teselas. Esto es lo que consumen PLUVIRA, la web y
# quien se conecte desde QGIS. Son de solo lectura: no hay forma de
# cambiar nada del servidor por aquí.
location /geoserver/ {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # SIN ESTO, GeoServer compone sus URL con http:// aunque se entre por
    # https, y el navegador bloquea el contenido mixto: el mapa queda en
    # blanco y en la consola sale un error que no habla de nginx.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Una ortofoto grande tarda en responder la primera vez que se pide
    # una zona. 60 s es el default de nginx y se queda corto justo cuando
    # alguien está esperando.
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Las imágenes ya vienen comprimidas: volver a comprimirlas gasta CPU
    # para nada. El XML de GetCapabilities sí, que son cientos de KB.
    gzip on;
    gzip_types text/xml application/xml application/vnd.ogc.wms_xml;
    gzip_proxied any;

}

# ── 3. (Opcional, cuando ya haya capas) La caché de teselas ───────────
#
# Una ortofoto no cambia: la misma tesela pedida mañana es idéntica. Sin
# esto, cada vez que alguien abre el mapa se vuelve a servir todo desde
# cero, y en el canal —con la cobertura que hay— eso es la diferencia
# entre un mapa que carga y uno que no.
#
# Va como location HERMANO de /geoserver/, no dentro: anidado hereda las
# cabeceras del padre a medias y acaba costando más de lo que ahorra.
# Nginx elige el prefijo más largo, así que este gana sobre /geoserver/.
#
# No hace falta hasta que haya una capa publicada.
#
