# Cuantas peticiones pesadas atiende GeoServer a la vez.
#
# POR QUE ESTO IMPORTA MAS DE LO QUE PARECE
# =========================================
#
# Una ortofoto se sirve leyendo trozos de un archivo de varios gigas. Diez
# personas moviendo el mapa a la vez son decenas de lecturas simultaneas,
# y la JVM intenta atenderlas TODAS: la memoria se dispara, el recolector
# de basura se pone al 100% de CPU y el servidor deja de responder — no
# solo GeoServer, la maquina entera, porque Postgres y Django compiten por
# el mismo procesador.
#
# Encolar es mejor que morir. Con esto, la peticion numero once espera su
# turno unas decimas en vez de tumbar el servicio.

# Total de peticiones OWS a la vez.
ows.global=16

# Las de imagen, que son las caras.
ows.wms.getmap=8

# Por usuario: que uno solo -o un mapa con muchas capas- no acapare.
user=6

# Una peticion que lleva mas de 60 s encolada se descarta. Quien la pidio
# ya se fue del mapa; servirla es gastar en nada.
timeout=60
