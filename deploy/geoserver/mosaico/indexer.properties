# Indice del mosaico de ortofotos.
#
# ══════════════════════════════════════════════════════════════════════
# ESTE ARCHIVO VA DENTRO DE LA CARPETA DE LOS .tif, NO EN EL REPO
# ══════════════════════════════════════════════════════════════════════
#
# Lo copia publicar_mosaico.sh a /var/www/geodatos/ortofotos/ antes de
# crear el almacen. GeoServer lo lee UNA sola vez, al construir el indice:
# si lo cambias despues hay que borrar el indice generado (ortofotos.shp,
# .dbf, .shx, .prj y ortofotos.properties) y volver a publicar, porque el
# indexer.properties ya no se vuelve a mirar.
#
# POR QUE UN MOSAICO Y NO UN GeoTIFF SUELTO:
#
#   Cada lateral es un vuelo aparte, con su propio .tif. Publicados como
#   capas independientes, el visor tendria que encender y apagar una por
#   una y el usuario veria diez casillas en vez de "la ortofoto". Con el
#   mosaico es UNA capa: GeoServer mira que granulo cae en la ventana que
#   le piden y solo abre ese.
#
#   Y crece bien: anadir el lateral 11 es dejar su .tif en la carpeta y
#   volver a correr el script. Nada que reconfigurar en el visor.

# El nombre de la capa publicada: quedara como jurp:ortofotos.
Name=ortofotos
TypeName=ortofotos

# Solo los .tif son granulos. Sin esto, el shapefile de la huella y el
# propio indice que GeoServer genera acaban leyendose como si fueran
# rasters, y el arranque se llena de errores que no explican nada.
Wildcard=*.tif

# Sin recursion: todos los vuelos viven en la misma carpeta, plana.
Recursive=false

# Rutas relativas a la carpeta del mosaico. Asi mover o respaldar la
# carpeta no rompe el indice, que es lo que pasa con rutas absolutas.
AbsolutePath=false

# Sin cache de granulos en memoria. Es util con miles de teselas
# pequenas; aqui son unos pocos archivos enormes y solo gasta RAM.
Caching=false
