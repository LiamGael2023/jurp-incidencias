# El recorte del fondo blanco.
#
# ══════════════════════════════════════════════════════════════════════
# QUE PROBLEMA RESUELVE
# ══════════════════════════════════════════════════════════════════════
#
# El ECW de cada lateral es un rectangulo de 21 x 9 km, pero el vuelo es
# una franja estrecha dentro de el. Todo lo demas es blanco puro. Puesto
# tal cual, la capa tapa con un bloque blanco el mapa base alrededor del
# canal, y en un mosaico tapa ademas la franja del lateral vecino.
#
# La salida obvia -decirle a GeoServer "el blanco es transparente" con
# InputTransparentColor- falla por dos lados: los pixeles saturados de la
# propia foto (arena clara, calamina) tambien desaparecen y dejan agujeros
# y, como el JPEG ensucia los bordes, el blanco pegado a la imagen deja de
# ser 255 exacto y queda un halo sucio siguiendo la franja.
#
# Con la huella no hay nada de eso: el recorte es geometrico, no por
# color. El interior no se toca.
#
# ══════════════════════════════════════════════════════════════════════
# DE DONDE SALE LA HUELLA
# ══════════════════════════════════════════════════════════════════════
#
# Por defecto GeoServer busca, al lado de cada granulo, un archivo con SU
# MISMO NOMBRE y extension .shp (tambien vale .wkt o .wkb):
#
#   ortofoto_lateral10.tif   <- el raster
#   ortofoto_lateral10.shp   <- su huella  (+ .dbf .shx .prj)
#
# Se calcula una vez con gdal_footprint sobre una copia reducida del ECW
# -ver LEEME.md- y pesa unos kilobytes.
#
# La alternativa es un unico shapefile para todos, con un campo `location`
# que case con el nombre de cada granulo. Es mas comodo de mantener en
# bloque y mas facil de desincronizar; con un vuelo por lateral, el
# archivo al lado del raster se explica solo:
#
# footprint_source=footprints.shp

# Encoger la huella 5 m hacia dentro.
#
# Limpia lo poco que la huella deja pasar: el contorno se calcula con
# `-simplify 5`, asi que puede despegarse hasta cinco metros del dato y
# dejar asomar un filo de la orla casi-blanca del borde del vuelo.
#
# CINCO, Y NO MAS. Se probo con 25 -parecia prudente- y se perdieron los
# tramos de tunel: ahi el vuelo es una faja de quince o veinte metros
# siguiendo el camino de servicio, y meter el corte veinticinco por cada
# lado la borra entera. En el mapa se veia un hueco de kilometros con la
# imagen intacta en el raster.
#
# Si queda orla visible, lo que hay que afinar es el umbral del
# gdal_calc -bajar 245-, no subir esto.
footprint_inset=5.0
footprint_inset_type=full
