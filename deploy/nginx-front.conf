# Front de jurp-incidencias servido desde el Linode nuevo (192.81.132.87).
#
# Instalar como /etc/nginx/sites-available/jurp-front y enlazar en sites-enabled.
# Reemplaza los "rewrites" de vercel.json: lo que allá resolvía el edge de Vercel,
# aquí lo resuelve nginx — y las dos APIs propias quedan en localhost, sin salir
# a internet.

server {
    listen 80;
    listen [::]:80;

    # El definitivo es nexhydro.jriegopresurizado.org.pe. El de nip.io se queda
    # al lado y no estorba: quien lo tenga guardado de antes del corte sigue
    # entrando. Quitarlo es cosa de un día en que a nadie le urja nada.
    server_name nexhydro.jriegopresurizado.org.pe nexhydro.192.81.132.87.nip.io;

    root /var/www/envs/front/current;
    index index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/jurp-front.access.log;
    error_log  /var/log/nginx/jurp-front.error.log;

    # Compresión: el bundle de este proyecto es grande (maplibre, exceljs, jspdf).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- APIs ---------------------------------------------------------------
    # Van antes que "location /" porque nginx evalúa los prefijos por longitud,
    # pero se declaran arriba por legibilidad.

    # SENTRIA / vigilantes  ->  django_api (contenedor local, puerto 8005)
    # Equivale a: /vigapi/(.*) -> https://api.192.81.132.87.nip.io/api/v1/$1
    location /vigapi/ {
        proxy_pass http://127.0.0.1:8005/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # PLUVIRA  ->  contenedor local (puerto 8003).
    #
    # Hasta el corte del 26/10/2026 esto apuntaba al Linode viejo con el Host
    # fijado a sistema.jriegopresurizado.org.pe, porque la base de aquí era la
    # copia del 12 de septiembre y le faltaba un mes de lecturas. Ya se
    # restauró el dump fresco, así que manda el contenedor local.
    #
    # El Host vuelve a ser $host: este nombre sí está en el ALLOWED_HOSTS de
    # /var/www/envs/prod/.env. Si alguna vez devuelve 400, es eso lo que hay
    # que mirar antes que nada.
    location /api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # InnovaWeather  ->  servicio externo (este sí sale a internet)
    # Equivale a: /innovapi/(.*) -> https://innovat.com.pe/InnovaWeather/api/$1
    location /innovapi/ {
        proxy_pass https://innovat.com.pe/InnovaWeather/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host innovat.com.pe;
        proxy_read_timeout 60s;
    }

    # --- Archivos estáticos -------------------------------------------------

    # Vite nombra los assets con hash, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html para que
    # el router de React la resuelva. index.html nunca se cachea, así el
    # navegador siempre descubre el bundle nuevo tras un despliegue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
