# Front de jurp-incidencias servido desde el Linode nuevo (192.81.132.87).
#
# Instalar como /etc/nginx/sites-available/jurp-front y enlazar en sites-enabled.
# Reemplaza los "rewrites" de vercel.json: lo que allá resolvía el edge de Vercel,
# aquí lo resuelve nginx — y las dos APIs propias quedan en localhost, sin salir
# a internet.

server {
    listen 80;
    listen [::]:80;

    # Mientras no se migre el Linode viejo se usa nip.io. Después, el definitivo
    # es nexhydro.jriegopresurizado.org.pe: se agrega aquí al lado del de nip.io
    # y se vuelve a correr certbot con los dos nombres.
    server_name nexhydro.192.81.132.87.nip.io;

    root /var/www/envs/front/current;
    index index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/jurp-front.access.log;
    error_log  /var/log/nginx/jurp-front.error.log;

    # Compresión: el bundle de este proyecto es grande (maplibre, exceljs, jspdf).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- APIs ---------------------------------------------------------------
    # Van antes que "location /" porque nginx evalúa los prefijos por longitud,
    # pero se declaran arriba por legibilidad.

    # SENTRIA / vigilantes  ->  django_api (contenedor local, puerto 8005)
    # Equivale a: /vigapi/(.*) -> https://api.192.81.132.87.nip.io/api/v1/$1
    location /vigapi/ {
        proxy_pass http://127.0.0.1:8005/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # PLUVIRA  ->  servidor VIEJO, de momento.
    #
    # El contenedor local (127.0.0.1:8003) ya responde y con la misma lógica,
    # pero su base es la copia del 12 de septiembre: le faltan un mes de
    # lecturas, los pluviómetros y las coordenadas de cuatro Davis. Apuntando
    # aquí, esta página muestra exactamente lo mismo que la de Vercel.
    #
    # EL DÍA DEL CORTE: volver a http://127.0.0.1:8003/api/ y devolver el
    # Host a $host, después de restaurar el dump fresco y de levantar beat,
    # davis_worker, elicrom_worker y push_service en /var/www/envs/prod.
    #
    # El Host va fijo porque el servidor viejo no tiene este dominio en su
    # ALLOWED_HOSTS y respondería 400.
    location /api/ {
        proxy_pass http://sistema.jriegopresurizado.org.pe/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              sistema.jriegopresurizado.org.pe;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # InnovaWeather  ->  servicio externo (este sí sale a internet)
    # Equivale a: /innovapi/(.*) -> https://innovat.com.pe/InnovaWeather/api/$1
    location /innovapi/ {
        proxy_pass https://innovat.com.pe/InnovaWeather/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host innovat.com.pe;
        proxy_read_timeout 60s;
    }

    # --- Archivos estáticos -------------------------------------------------

    # Vite nombra los assets con hash, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html para que
    # el router de React la resuelva. index.html nunca se cachea, así el
    # navegador siempre descubre el bundle nuevo tras un despliegue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
